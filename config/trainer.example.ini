; 转运军团 修改器配置。复制成 trainer.ini 再改；菜单里改的设置会自动存回 trainer.ini。
; 按键写虚拟键码（0x2D = Insert，0x7B = F12，0x79 = F10，0x23 = End），0 = 不绑。

[general]
enabled=true
panic_key=0x7B
menu_key=0x2D
hide_key=0x79
exit_key=0x23
process_name=Slotbound.exe

[coins]
lock=false          ; 锁定金币：花了也会写回锁定值
lock_value=99999
add_amount=1000     ; 「加金币」每次加多少
lock_key=0x00
add_key=0x00

[spins]             ; 剩余旋转次数（Lua 全局 spinsLeft）
lock=false
lock_value=99
add_amount=5
lock_key=0x00
add_key=0x00

[jungsu]            ; 水晶（Lua 全局 jungsu，韩语 정수 = 精华）
lock=false
lock_value=99
add_amount=5
lock_key=0x00
add_key=0x00

[debug]
overlay=true        ; 左上角状态栏
